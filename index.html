<!DOCTYPE html>
<html lang="vi">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Discover Your Style</title>

<style>

*{
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f5f7fb;
    padding:20px;
    margin:0;
}

.container{
    max-width:1100px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 4px 20px rgba(0,0,0,0.06);
}

h1{
    text-align:center;
    color:#003b70;
    margin-top:0;
}

.note{
    text-align:center;
    line-height:1.6;
    color:#444;
}

.note p{
    margin:5px 0;
}

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:25px;
    min-width:800px;
}

th{
    background:#003b70;
    color:white;
    padding:14px 10px;
    font-size:16px;
}

td{
    border:1px solid #ddd;
    padding:15px 10px;
    text-align:center;
    vertical-align:top;
    width:25%;
}

.name{
    font-weight:bold;
    font-size:16px;
    min-height:40px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#222;
}

.score-options{
    margin-top:12px;
    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
}

.score-option{
    display:flex;
    align-items:center;
    gap:4px;
    cursor:pointer;
    font-size:15px;
    font-weight:bold;
}

.score-option input{
    transform:scale(1.25);
    cursor:pointer;
}

.score-option input:disabled{
    cursor:not-allowed;
}

button{
    margin-top:30px;
    width:100%;
    padding:15px;
    background:#0066cc;
    border:0;
    color:white;
    border-radius:10px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#0055aa;
}

.result{
    display:none;
    margin-top:30px;
    background:#eef6ff;
    padding:25px;
    border-radius:12px;
}

.result h2{
    text-align:center;
    color:#003b70;
    margin-top:0;
}

.total-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-top:20px;
}

.total-card{
    background:white;
    border-radius:10px;
    padding:18px 10px;
    text-align:center;
    box-shadow:0 2px 8px rgba(0,0,0,0.06);
}

.total-title{
    font-size:15px;
    color:#555;
    margin-bottom:8px;
}

.total-score{
    font-size:26px;
    font-weight:bold;
    color:#003b70;
}

.chart{
    margin-top:30px;
}

.chart-row{
    display:grid;
    grid-template-columns:80px 1fr 60px;
    align-items:center;
    gap:10px;
    margin:14px 0;
}

.chart-label{
    font-weight:bold;
    color:#333;
}

.chart-track{
    height:28px;
    background:#dce5ef;
    border-radius:20px;
    overflow:hidden;
}

.chart-bar{
    height:100%;
    width:0;
    background:#0066cc;
    border-radius:20px;
    transition:width 0.6s ease;
}

.chart-value{
    font-weight:bold;
    text-align:right;
    color:#003b70;
}

.error-row td{
    background:#fff1f1;
}

@media(max-width:700px){

    body{
        padding:10px;
    }

    .container{
        padding:18px;
    }

    .total-grid{
        grid-template-columns:repeat(2,1fr);
    }

}

</style>
</head>


<body>

<div class="container">

<h1>DISCOVER YOUR STYLE</h1>

<div class="note">

<p>
Hãy đánh giá mức độ phù hợp của từng đặc điểm.
</p>

<p>
Trong <b>mỗi hàng</b>, hãy phân bổ đủ 4 mức điểm và không được trùng:
</p>

<p>
<b>
4 điểm - Giống mình nhất |
3 điểm - Gần giống |
2 điểm - Ít giống |
1 điểm - Ít giống nhất
</b>
</p>

</div>


<div class="table-wrap">

<table>

<thead>

<tr>
<th>Nhóm 1</th>
<th>Nhóm 2</th>
<th>Nhóm 3</th>
<th>Nhóm 4</th>
</tr>

</thead>

<tbody id="quizTable"></tbody>

</table>

</div>


<button onclick="calculate()">
Xem kết quả
</button>


<div id="result" class="result"></div>

</div>


<script>

const data = [

    [
        "Chỉ đạo",
        "Có ảnh hưởng",
        "Chắc chắn",
        "Cẩn thận"
    ],

    [
        "Quyết đoán",
        "Lạc quan",
        "Kiên nhẫn",
        "Dễ đặt"
    ],

    [
        "Dám làm",
        "Nhiệt tình",
        "Ổn định",
        "Có phân tích"
    ],

    [
        "Thích cạnh tranh",
        "Hay nói",
        "Hay giúp đỡ",
        "Chính xác"
    ],

    [
        "Mạnh mẽ",
        "Duyên dáng",
        "Dễ tính",
        "Tò mò"
    ]

];


let html = "";


data.forEach((row, rowIndex) => {

    html += `<tr id="row-${rowIndex}">`;

    row.forEach((item, colIndex) => {

        html += `

        <td>

            <div class="name">
                ${item}
            </div>

            <div class="score-options">

                ${[4,3,2,1].map(score => `

                    <label class="score-option">

                        ${score}

                        <input
                            type="radio"
                            name="row${rowIndex}_col${colIndex}"
                            value="${score}"
                            data-row="${rowIndex}"
                            data-col="${colIndex}"
                            onchange="handleSelection(${rowIndex})"
                        >

                    </label>

                `).join("")}

            </div>

        </td>

        `;

    });

    html += `</tr>`;

});


document.getElementById("quizTable").innerHTML = html;


/*
================================================
KIỂM SOÁT KHÔNG CHO TRÙNG ĐIỂM TRONG CÙNG HÀNG
================================================
*/

function handleSelection(rowIndex){

    const row = document.getElementById("row-" + rowIndex);

    row.classList.remove("error-row");


    /*
    Lấy các điểm hiện đang được chọn trong hàng
    */

    const checked = document.querySelectorAll(
        `input[data-row="${rowIndex}"]:checked`
    );


    const selectedScores = [];

    checked.forEach(input => {

        selectedScores.push({
            score: input.value,
            col: input.dataset.col
        });

    });


    /*
    Duyệt toàn bộ radio của hàng
    */

    const allInputs = document.querySelectorAll(
        `input[data-row="${rowIndex}"]`
    );


    allInputs.forEach(input => {

        /*
        Radio đang được chọn thì luôn giữ hoạt động
        */

        if(input.checked){

            input.disabled = false;
            return;

        }


        const currentCol = input.dataset.col;
        const currentScore = input.value;


        /*
        Kiểm tra điểm này đã được dùng
        ở một cột khác chưa
        */

        const usedInOtherColumn = selectedScores.some(item => {

            return (
                item.score === currentScore &&
                item.col !== currentCol
            );

        });


        input.disabled = usedInOtherColumn;

    });

}


/*
================================================
TÍNH KẾT QUẢ
================================================
*/

function calculate(){

    let totals = [0,0,0,0];

    let complete = true;


    /*
    Xóa trạng thái báo lỗi cũ
    */

    document.querySelectorAll("tr").forEach(row => {

        row.classList.remove("error-row");

    });


    /*
    Kiểm tra từng hàng
    */

    for(let rowIndex = 0; rowIndex < data.length; rowIndex++){

        let rowValues = [];


        /*
        Kiểm tra từng cột
        */

        for(let colIndex = 0; colIndex < 4; colIndex++){

            const selected = document.querySelector(

                `input[name="row${rowIndex}_col${colIndex}"]:checked`

            );


            if(!selected){

                complete = false;

                document
                    .getElementById("row-" + rowIndex)
                    .classList.add("error-row");

                continue;

            }


            const value = Number(selected.value);

            rowValues.push(value);

            totals[colIndex] += value;

        }


        /*
        Nếu đã đủ 4 cột
        thì kiểm tra phải đúng 1,2,3,4
        */

        if(rowValues.length === 4){

            const sorted =
                [...rowValues].sort((a,b) => a-b);


            if(sorted.join(",") !== "1,2,3,4"){

                complete = false;

                document
                    .getElementById("row-" + rowIndex)
                    .classList.add("error-row");

            }

        }

    }


    /*
    Nếu chưa hoàn thành
    */

    if(!complete){

        alert(
            "Mỗi hàng phải chấm đủ 4 cột và sử dụng đủ các mức điểm 1, 2, 3, 4."
        );

        return;

    }


    /*
    Tìm điểm cao nhất để làm tỷ lệ biểu đồ
    */

    const maxScore =
        Math.max(...totals);


    const percentages =
        totals.map(score => {

            if(maxScore === 0){
                return 0;
            }

            return (score / maxScore) * 100;

        });


    /*
    Hiển thị kết quả
    */

    const result =
        document.getElementById("result");


    result.style.display = "block";


    result.innerHTML = `

        <h2>Kết quả của bạn</h2>


        <div class="total-grid">

            <div class="total-card">

                <div class="total-title">
                    Nhóm 1
                </div>

                <div class="total-score">
                    ${totals[0]}
                </div>

            </div>


            <div class="total-card">

                <div class="total-title">
                    Nhóm 2
                </div>

                <div class="total-score">
                    ${totals[1]}
                </div>

            </div>


            <div class="total-card">

                <div class="total-title">
                    Nhóm 3
                </div>

                <div class="total-score">
                    ${totals[2]}
                </div>

            </div>


            <div class="total-card">

                <div class="total-title">
                    Nhóm 4
                </div>

                <div class="total-score">
                    ${totals[3]}
                </div>

            </div>

        </div>


        <div class="chart">

            <div class="chart-row">

                <div class="chart-label">
                    Nhóm 1
                </div>

                <div class="chart-track">

                    <div
                        class="chart-bar"
                        style="width:${percentages[0]}%">
                    </div>

                </div>

                <div class="chart-value">
                    ${totals[0]}
                </div>

            </div>


            <div class="chart-row">

                <div class="chart-label">
                    Nhóm 2
                </div>

                <div class="chart-track">

                    <div
                        class="chart-bar"
                        style="width:${percentages[1]}%">
                    </div>

                </div>

                <div class="chart-value">
                    ${totals[1]}
                </div>

            </div>


            <div class="chart-row">

                <div class="chart-label">
                    Nhóm 3
                </div>

                <div class="chart-track">

                    <div
                        class="chart-bar"
                        style="width:${percentages[2]}%">
                    </div>

                </div>

                <div class="chart-value">
                    ${totals[2]}
                </div>

            </div>


            <div class="chart-row">

                <div class="chart-label">
                    Nhóm 4
                </div>

                <div class="chart-track">

                    <div
                        class="chart-bar"
                        style="width:${percentages[3]}%">
                    </div>

                </div>

                <div class="chart-value">
                    ${totals[3]}
                </div>

            </div>

        </div>

    `;


    /*
    Cuộn xuống phần kết quả
    */

    result.scrollIntoView({
        behavior:"smooth"
    });

}

</script>

</body>
</html>
