<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Discover Your Style</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f5f7fb;
padding:20px;
}


.container{
max-width:1100px;
margin:auto;
background:white;
padding:30px;
border-radius:15px;
}


h1{
text-align:center;
color:#003b70;
}


.note{
text-align:center;
line-height:1.6;
}


table{
width:100%;
border-collapse:collapse;
margin-top:25px;
}


th{
background:#003b70;
color:white;
padding:12px;
}


td{
border:1px solid #ddd;
padding:12px;
text-align:center;
}


.name{
font-weight:bold;
font-size:16px;
}


input{
transform:scale(1.3);
cursor:pointer;
}


button{
margin-top:30px;
width:100%;
padding:15px;
background:#0066cc;
border:0;
color:white;
border-radius:10px;
font-size:18px;
}


.result{
display:none;
margin-top:30px;
background:#eef6ff;
padding:20px;
border-radius:10px;
}


</style>

</head>


<body>


<div class="container">


<h1>
DISCOVER YOUR STYLE
</h1>


<div class="note">

<p>
Hãy đánh giá mức độ phù hợp của từng đặc điểm.
</p>

<p>
Trong mỗi hàng, bạn phải phân bổ đủ:
</p>

<p>
<b>
4 điểm - Giống mình nhất |
3 điểm - Gần giống |
2 điểm - Ít giống |
1 điểm - Ít giống nhất
</b>
</p>

</div>



<table>


<tr>

<th>Nhóm 1</th>
<th>Nhóm 2</th>
<th>Nhóm 3</th>
<th>Nhóm 4</th>

</tr>



<tbody id="quizTable"></tbody>


</table>



<button onclick="calculate()">
Xem kết quả
</button>


<div id="result" class="result"></div>


</div>





<script>


const data=[


[
"Chỉ đạo",
"Có ảnh hưởng",
"Chắc chắn",
"Cẩn thận"
],


[
"Quyết đoán",
"Lạc quan",
"Kiên nhẫn",
"Dễ đặt"
],


[
"Dám làm",
"Nhiệt tình",
"Ổn định",
"Có phân tích"
],


[
"Thích cạnh tranh",
"Hay nói",
"Hay giúp đỡ",
"Chính xác"
],


[
"Mạnh mẽ",
"Duyên dáng",
"Dễ tính",
"Tò mò"
]


];



let html="";



data.forEach((row,index)=>{


html+=`

<tr>

`;



row.forEach((item,col)=>{


html+=`

<td>

<div class="name">
${item}
</div>


<br>


<label>
4
<input 
type="radio"
name="row${index}"
value="4"
data-col="${col}">
</label>


<label>
3
<input 
type="radio"
name="row${index}"
value="3"
data-col="${col}">
</label>


<label>
2
<input 
type="radio"
name="row${index}"
value="2"
data-col="${col}">
</label>


<label>
1
<input 
type="radio"
name="row${index}"
value="1"
data-col="${col}">
</label>


</td>


`;


});


html+="</tr>";


});



document.getElementById("quizTable").innerHTML=html;






function calculate(){


let totals=[0,0,0,0];



for(let i=0;i<5;i++){


let selected=
document.querySelector(
'input[name="row'+i+'"]:checked'
);


if(!selected){

alert(
"Bạn chưa hoàn thành hàng số "+(i+1)
);

return;

}



let value=
Number(selected.value);



let col=
Number(selected.dataset.col);



totals[col]+=value;


}




let result=
document.getElementById("result");


result.style.display="block";


result.innerHTML=`

<h2>Kết quả của bạn</h2>

<p>
Nhóm 1: <b>${totals[0]} điểm</b>
</p>

<p>
Nhóm 2: <b>${totals[1]} điểm</b>
</p>

<p>
Nhóm 3: <b>${totals[2]} điểm</b>
</p>

<p>
Nhóm 4: <b>${totals[3]} điểm</b>
</p>

`;



}



</script>


</body>

</html>
